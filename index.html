<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NUR.LIFE Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* --- НАСТРОЙКИ ФОНА --- */
        body {
            /* https://github.com/Student5155/usman-bot/blob/main/основная%20 */
            background-image: url('https://raw.githubusercontent.com/Student5155/usman-bot/main/fon.jpg');
            background-size: cover;       /* Растягивает картинку на весь экран */
            background-position: center;  /* Центрирует картинку */
            background-attachment: fixed; /* Фон не двигается при прокрутке */
            background-repeat: no-repeat;
            
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 15px;
            padding-bottom: 80px;
            min-height: 100vh;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
            color: #ffffff; /* Белый заголовок, чтобы выделялся на фоне */
            text-shadow: 0 2px 4px rgba(0,0,0,0.5); /* Тень для читаемости */
        }

        .category {
            font-size: 18px;
            font-weight: bold;
            margin-top: 25px;
            margin-bottom: 12px;
            padding-left: 10px;
            border-left: 4px solid var(--tg-theme-button-color, #3390ec);
            color: #ffffff; /* Белый текст категории */
            text-shadow: 0 1px 3px rgba(0,0,0,0.7);
        }

        .product {
            /* Полупрозрачный белый фон карточки, чтобы текст читался на любой картинке */
            background-color: rgba(255, 255, 255, 0.9); 
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            color: #000000;
        }

        .product img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
            background-color: #e0e0e0;
        }

        .product-name {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 6px;
        }

        .product-desc {
            font-size: 13px;
            color: #555555;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .product-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price {
            font-weight: bold;
            color: #27ae60;
            font-size: 16px;
        }

        .btn {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        .btn:active {
            opacity: 0.8;
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <h1>NUR.LIFE MARKET</h1>
    <div id="app">Загрузка товаров...</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const products = [
            { 
                category: "Витамины и БАДы", 
                name: "AKSUVITAL Vitamin D3 + K2", 
                desc: "2000/5000/10000 IU. Для костей, зубов и иммунитета.", 
                price: "от 800₽",
                image: "https://raw.githubusercontent.com/Student5155/usman-bot/main/2026-09-01%2019.38.44.jpg"
            },
            { 
                category: "Витамины и БАДы", 
                name: "Black Seed Oil (Черный тмин)", 
                desc: "150 капсул. Масло холодного отжима для общего укрепления.", 
                price: "1200₽",
                image: "https://raw.githubusercontent.com/Student5155/usman-bot/main/2026-09-01%2019.39.13.jpg"
            },
            { 
                category: "Красота и Молодость", 
                name: "Nutraxin Collagen Booster", 
                desc: "Растительный коллаген. 300г. Веганский состав.", 
                price: "1500₽",
                image: "https://raw.githubusercontent.com/Student5155/usman-bot/main/2026-09-01%2019.39.21.jpg"
            },
            { 
                category: "Натуральные продукты", 
                name: "Кыст Аль-Хинди (Капсулы)", 
                desc: "100 капсул. Натуральный корень из Индии.", 
                price: "900₽",
                image: "https://raw.githubusercontent.com/Student5155/usman-bot/main/2026-09-01%2019.39.37.jpg"
            },
            { 
                category: "Натуральные продукты", 
                name: "Чай Расторопша (Minor)", 
                desc: "20 пакетиков. Натуральная защита и очистка печени.", 
                price: "450₽",
                image: "https://raw.githubusercontent.com/Student5155/usman-bot/main/2026-09-01%2019.39.43.jpg"
            }
        ];

        const app = document.getElementById('app');
        let html = '';
        let currentCategory = '';

        products.forEach(p => {
            if (p.category !== currentCategory) {
                currentCategory = p.category;
                html += `<div class="category">${currentCategory}</div>`;
            }
            
            html += `
                <div class="product">
                    ${p.image ? `<img src="${p.image}" alt="${p.name}">` : ''}
                    <div class="product-name">${p.name}</div>
                    <div class="product-desc">${p.desc}</div>
                    <div class="product-bottom">
                        <span class="price">${p.price}</span>
                        <button class="btn" onclick="addToCart('${p.name}')">В корзину</button>
                    </div>
                </div>
            `;
        });

        app.innerHTML = html;

        function addToCart(productName) {
            tg.showPopup({
                title: 'Успешно!',
                message: `Товар "${productName}" добавлен в корзину.`,
                buttons: [{type: 'ok'}]
            });
        }
    </script>
</body>
</html>
